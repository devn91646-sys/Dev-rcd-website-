<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RCB FAN - DEV ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    background:
      radial-gradient(circle at top,#2196f3 0%,transparent 35%),
      linear-gradient(135deg,#020b18,#003b73,#020b18);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle,#fff 1px,transparent 2px);
    background-size:45px 45px;
    opacity:.25;
    animation:stars 8s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0);}
    to{transform:translateY(45px);}
}

header{
    text-align:center;
    padding:28px 10px;
    background:linear-gradient(90deg,#003b73,#2196f3,#003b73);
    box-shadow:0 0 35px #2196f3;
}

header h1{
    font-size:42px;
    text-shadow:0 0 8px white,0 0 20px #2196f3,0 0 40px #0066cc;
    animation:shine 1.5s infinite alternate;
}

header p{
    margin-top:8px;
    font-size:18px;
}

@keyframes shine{
    from{filter:brightness(1);}
    to{filter:brightness(1.7);}
}

.dev{
    text-align:center;
    padding:25px 10px 5px;
}

.dev h2{
    font-size:32px;
    color:#ffd700;
    text-shadow:0 0 10px #ffd700,0 0 25px #0066cc;
}

.hero{
    text-align:center;
    padding:25px 15px;
}

.hero img{
    width:240px;
    height:240px;
    object-fit:cover;
    border-radius:50%;
    border:6px solid #2196f3;
    box-shadow:0 0 15px white,0 0 35px #2196f3,0 0 70px #0066cc;
    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    to{
        transform:scale(1.04);
        box-shadow:0 0 25px white,0 0 50px #2196f3,0 0 90px #0066cc;
    }
}

.hero h2{
    margin-top:18px;
    font-size:34px;
    color:#42a5f5;
    text-shadow:0 0 15px #0066cc;
}

.hero p{
    margin-top:8px;
    font-size:17px;
}

.title{
    text-align:center;
    margin:25px 0;
    font-size:28px;
    color:#ffd700;
    text-shadow:0 0 15px gold;
}

.players{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:22px;
    padding:20px;
    max-width:1000px;
    margin:auto;
}

.card{
    text-align:center;
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.08);
    border:2px solid #2196f3;
    box-shadow:0 0 15px rgba(0,102,204,.6);
    transition:.35s;
    backdrop-filter:blur(5px);
}

.card:hover{
    transform:translateY(-10px) scale(1.04);
    box-shadow:0 0 20px white,0 0 45px #2196f3;
}

.card img{
    width:145px;
    height:145px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #2196f3;
    box-shadow:0 0 20px #0066cc;
}

.card h3{
    margin-top:13px;
    font-size:21px;
    color:#64b5f6;
}

.card p{
    margin-top:7px;
    color:#ddd;
}

footer{
    margin-top:35px;
    text-align:center;
    padding:28px;
    background:#020b18;
    border-top:2px solid #2196f3;
    box-shadow:0 -5px 25px #2196f3;
}

footer h2{
    color:#2196f3;
    text-shadow:0 0 15px #0066cc;
}

footer p{
    margin-top:8px;
}
</style>
</head>

<body>

<header>
    <h1>🏏 RCB FAN ❤️</h1>
    <p>ROYAL CHALLENGERS BENGALURU</p>
</header>

<div class="dev">
    <h2>✨ DEV RCB WEBSITE ✨</h2>
</div>

<!-- VIRAT KOHLI -->
<section class="hero">

    <img src="https://documents.iplt20.com/ipl/IPLHeadshot2025/2.png"
         alt="Virat Kohli">

    <h2>👑 VIRAT KOHLI 👑</h2>

    <p>❤️ RCB Legend • King Kohli • Run Machine ❤️</p>

</section>

<h2 class="title">🔥 RCB PLAYERS 🔥</h2>

<section class="players">

    <!-- RAJAT PATIDAR -->
    <div class="card">
        <img src="https://documents.iplt20.com/ipl/IPLHeadshot2025/597.png"
             alt="Rajat Patidar">
        <h3>Rajat Patidar</h3>
        <p>🏏 Batter</p>
    </div>

    <!-- PHIL SALT -->
    <div class="card">
        <img src="https://documents.iplt20.com/ipl/IPLHeadshot2025/1220.png"
             alt="Phil Salt">
        <h3>Phil Salt</h3>
        <p>🏏 Wicketkeeper Batter</p>
    </div>

</section>

<footer>
    <h2>❤️ PLAY BOLD ❤️</h2>
    <p>RCB FAN WEBSITE • Made by DEV</p>
</footer>

</body>
          </html>
